<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute Valentine's Day page to ask someone to be your Valentine!">
  <meta name="theme-color" content="#ffd0e5">
  <title>Valentine's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }

    /* CUSTOM CUTE OPTION BUTTONS */
    .cute-option input { display: none; }
    .cute-option span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 9999px;
      background-color: #fff0f5;
      border: 2px solid #ffb6c1;
      color: #9d174d;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .cute-option input:checked + span {
      background-color: #f43f5e;
      border-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
      transform: translateY(-2px);
    }
    .cute-option span::before {
      content: '🤍';
      font-size: 0.85rem;
    }
    .cute-option input:checked + span::before {
      content: '💖';
    }

    /* CARD CHOICE BUTTONS */
    .location-card {
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .location-card:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="gradient-background flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl flex flex-col items-center text-center my-auto border border-white/60">
    
    <!-- GIF MÈO CHUẨN ONLINE -->
    <img
      id="imageDisplay"
      src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2eHBiZWpndTF3dW96YWN4dTh2dWh4aTJqNXA1OHI0ZWhuaWh6OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cfAOGM7rtKptNn/giphy.gif"
      alt="Cute kitten with flowers"
      class="rounded-2xl h-[240px] w-full object-cover mb-4 shadow-md"
    />

    <!-- Tiêu đề chính -->
    <h1 id="valentineQuestion" class="text-3xl font-bold italic text-[#bd1e59] my-2">
      Will you be my Valentine?
    </h1>

    <!-- MÀN HÌNH 1: YES / NO -->
    <div id="responseButtons" class="flex gap-4 pt-3 items-center justify-center min-h-[60px]">
      <button
        id="yesButton"
        class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-bold cursor-pointer px-6 py-3 bg-pink-500 text-white transition-all duration-300 ease-in-out hover:bg-pink-600 min-h-12 min-w-[90px] shadow-md"
      >
        Yes 💕
      </button>
      <button
        id="noButton"
        class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-medium cursor-pointer px-6 py-3 bg-gray-400 text-white transition-colors hover:bg-gray-500 h-12 min-w-[90px] shadow-md"
      >
        No 🥺
      </button>
    </div>

    <!-- MÀN HÌNH 2: BƯỚC 1 - CHỌN HỒ CHÍ MINH HOẶC VŨNG TÀU -->
    <div id="locationSelection" class="hidden w-full text-left mt-3 space-y-3">
      <p class="text-center text-pink-700 font-bold text-lg mb-2">Tụi mình sẽ hẹn hò ở đâu nè? 📍</p>
      
      <div onclick="selectLocation('HCM')" class="location-card bg-pink-50 p-4 rounded-2xl border-2 border-pink-200 hover:border-pink-400 flex items-center justify-between shadow-sm">
        <div>
          <h2 class="text-xl font-bold text-[#bd1e59]">Hẹn hò ở Hồ Chí Minh 🏙️</h2>
          <p class="text-xs text-pink-600 mt-1">Phố thị nhộn nhịp, quán xá chill chill</p>
        </div>
        <span class="text-2xl">✨</span>
      </div>

      <div onclick="selectLocation('VT')" class="location-card bg-sky-50 p-4 rounded-2xl border-2 border-sky-200 hover:border-sky-400 flex items-center justify-between shadow-sm">
        <div>
          <h2 class="text-xl font-bold text-sky-700">Hẹn hò ở Vũng Tàu 🌊</h2>
          <p class="text-xs text-sky-600 mt-1">Gió biển mát rượi, ngắm hoàng hôn</p>
        </div>
        <span class="text-2xl">🌅</span>
      </div>
    </div>

    <!-- MÀN HÌNH 2: BƯỚC 2 - CHI TIẾT TỪNG ĐỊA ĐIỂM -->
    <div id="detailsContainer" class="hidden w-full text-left mt-3 space-y-4">
      
      <!-- Nút quay lại chọn địa điểm khác -->
      <button onclick="backToLocationSelection()" class="text-xs font-semibold text-pink-600 hover:underline flex items-center gap-1 mb-1">
        ← Chọn lại địa điểm khác
      </button>

      <!-- DETAIL HỒ CHÍ MINH -->
      <div id="hcmDetails" class="space-y-4 hidden">
        <div>
          <label class="block text-base font-bold text-[#bd1e59] mb-2">1. Món ăn yêu thích ở Sài Gòn 🍲</label>
          <div class="flex flex-wrap gap-2">
            <label class="cute-option">
              <input type="radio" name="hcmFood" value="Món Hàn Quốc 🇰🇷" checked>
              <span>Món Hàn Quốc 🇰🇷</span>
            </label>
            <label class="cute-option">
              <input type="radio" name="hcmFood" value="Món Nhật Bản 🇯🇵">
              <span>Món Nhật Bản 🇯🇵</span>
            </label>
            <label class="cute-option">
              <input type="radio" name="hcmFood" value="Món Việt Nam 🇻🇳">
              <span>Món Việt Nam 🇻🇳</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-base font-bold text-[#bd1e59] mb-2">2. Hoạt động tụi mình cùng làm 🛵</label>
          <div class="flex flex-wrap gap-2">
            <label class="cute-option">
              <input type="checkbox" name="hcmAct" value="Đi mall dạo phố 🛍️" checked>
              <span>Đi mall dạo phố 🛍️</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="hcmAct" value="Quán bí mật 🤫">
              <span>Dắt đi quán bí mật 🤫</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="hcmAct" value="Homestay chill chill 🏡">
              <span>Homestay chill 🏡</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="hcmAct" value="Làm nến thơm / gốm 🎨">
              <span>Workshop gốm/nến 🎨</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="hcmAct" value="Cùng chơi Boardgame 🎲">
              <span>Chơi Boardgame 🎲</span>
            </label>
          </div>
        </div>
      </div>

      <!-- DETAIL VŨNG TÀU -->
      <div id="vtDetails" class="space-y-4 hidden">
        <div>
          <label class="block text-base font-bold text-sky-700 mb-2">1. Ra biển mình ăn gì đây? 🦀</label>
          <div class="flex flex-wrap gap-2">
            <label class="cute-option">
              <input type="radio" name="vtFood" value="Hải sản xèo xèo 🦀" checked>
              <span>Hải sản tươi sống 🦀</span>
            </label>
            <label class="cute-option">
              <input type="radio" name="vtFood" value="Lẩu cá đuối nóng hổi 🍲">
              <span>Lẩu cá đuối 🍲</span>
            </label>
            <label class="cute-option">
              <input type="radio" name="vtFood" value="Bánh khọt truyền thống 🍳">
              <span>Bánh khọt giòn rụm 🍳</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-base font-bold text-sky-700 mb-2">2. Trải nghiệm vui ở Vũng Tàu 🌅</label>
          <div class="flex flex-wrap gap-2">
            <label class="cute-option">
              <input type="checkbox" name="vtAct" value="Ngắm hoàng hôn bờ biển 🌅" checked>
              <span>Ngắm hoàng hôn 🌅</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="vtAct" value="Check-in Mũi Nghinh Phong 📸">
              <span>Check-in Mũi Nghinh Phong 📸</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="vtAct" value="Lái xe dạo biển đêm 🛵">
              <span>Dạo đường biển đêm 🛵</span>
            </label>
            <label class="cute-option">
              <input type="checkbox" name="vtAct" value="Thuê Homestay view biển 🏡">
              <span>Homestay view biển 🏡</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Nút Chốt đơn -->
      <button
        id="submitOptionsBtn"
        class="w-full mt-2 py-3 bg-[#bd1e59] text-white font-bold text-lg rounded-full shadow-lg hover:bg-[#a0184a] transition-all cursor-pointer transform hover:scale-[1.02] active:scale-95"
      >
        Chốt đơn luôn! 💕
      </button>
    </div>

    <!-- MÀN HÌNH TỔNG HỢP / CẢM ƠN -->
    <div id="finalSummary" class="hidden text-center mt-2 w-full space-y-3">
      <div id="summaryContent" class="bg-pink-50/90 p-4 rounded-2xl text-gray-800 leading-relaxed text-left border border-pink-200 shadow-inner text-base">
        <!-- Nội dung tổng hợp -->
      </div>
      <p class="text-xs text-pink-600 font-semibold italic">📸 Chụp màn hình này gửi lại cho tui nhen!</p>
    </div>

  </main>

  <script>
    let currentSelectedLocation = '';

    function selectLocation(loc) {
      currentSelectedLocation = loc;
      document.getElementById('locationSelection').classList.add('hidden');
      document.getElementById('detailsContainer').classList.remove('hidden');

      const hcmDetails = document.getElementById('hcmDetails');
      const vtDetails = document.getElementById('vtDetails');

      if (loc === 'HCM') {
        hcmDetails.classList.remove('hidden');
        vtDetails.classList.add('hidden');
      } else {
        vtDetails.classList.remove('hidden');
        hcmDetails.classList.add('hidden');
      }
    }

    function backToLocationSelection() {
      document.getElementById('detailsContainer').classList.add('hidden');
      document.getElementById('locationSelection').classList.remove('hidden');
    }

    (() => {
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');
      const locationSelection = document.getElementById('locationSelection');
      const detailsContainer = document.getElementById('detailsContainer');
      const submitOptionsBtn = document.getElementById('submitOptionsBtn');
      const finalSummary = document.getElementById('finalSummary');
      const summaryContent = document.getElementById('summaryContent');

      const GROWTH_PER_CLICK = 30;
      const FONT_GROWTH_PER_CLICK = 15;
      const MAX_NO_CLICKS = 5;

      // KHO GIF MÈO ONLINE CHẮC CHẮN HIỆN
      const IMAGE_PATHS = [
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2eHBiZWpndTF3dW96YWN4dTh2dWh4aTJqNXA1OHI0ZWhuaWh6OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cfAOGM7rtKptNn/giphy.gif', // Mèo ôm tim
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmNnaXk2aDFkdnA3bmdvNWdpYmExZnRzdmxwaHB1ZmxocjhicG54eiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ISOckXUvpE92w/giphy.gif', // Mèo buồn
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnlvdXNmbWRpMDc1am9rdXhhYjZlbnlsZG96bGFubXlsb24xbzh5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ROF8OQvDmxytW/giphy.gif', // Mèo xin xỏ
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHM3ZnpoYjJ0OWw0YXd2OHFxeTZidnpra2lud3d1aWF5OG9vOXZpbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22UJ47yvGDXdbq0/giphy.gif', // Mèo khóc
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3RzbHNtMHlhNGI1OGZ0bGl6OHI4NHJqczd2NzBhMzA0ZmFocWZ6ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TW8Ma1S9553CI/giphy.gif', // Mèo suy sụp
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bzRqZTVxMmY0cTlwa3psM2Y4cGF3MXNveGFxZzA5MzJwYXNnOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6Is1FJGR0Przj9Wu6i/giphy.gif'  // Mèo nhảy Happy
      ];

      const NO_BUTTON_MESSAGES = [
        'No 🥺',
        'Bồ chắc chưa? 😢',
        'Năn nỉ đóooo 🙏',
        'Đừng làm vậy mà... 💔',
        'Tim tui đau quá 😭',
        'Nước mắt ngắn dài luôn nè...'
      ];

      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 90;
      let fontSize = 20;

      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;

        noClickCount++;
        imageDisplay.src = IMAGE_PATHS[noClickCount];

        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        valentineQuestion.textContent = 'Yayyy!! Chọn địa điểm nè :3';
        responseButtons.style.display = 'none';

        // Hiện màn hình chọn Hồ Chí Minh hay Vũng Tàu
        locationSelection.classList.remove('hidden');

        // Bắn pháo hoa trái tim
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });
        const defaults = { spread: 360, ticks: 100, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };
        confetti({ ...defaults, particleCount: 50, scalar: 2 });
        confetti({ ...defaults, particleCount: 25, scalar: 3 });
      });

      submitOptionsBtn.addEventListener('click', () => {
        let food = "", acts = [];
        let locName = "";

        if (currentSelectedLocation === 'HCM') {
          locName = 'Hồ Chí Minh 🏙️';
          food = document.querySelector('input[name="hcmFood"]:checked')?.value || "Món gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="hcmAct"]:checked')).map(cb => cb.value);
        } else {
          locName = 'Vũng Tàu 🌊';
          food = document.querySelector('input[name="vtFood"]:checked')?.value || "Món gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="vtAct"]:checked')).map(cb => cb.value);
        }

        const activitiesText = acts.length > 0 ? acts.join(', ') : 'Thư giãn nghỉ ngơi';

        valentineQuestion.textContent = 'Hẹn gặp bồ chuyến đi tới nha! 🥰';
        detailsContainer.classList.add('hidden');
        finalSummary.classList.remove('hidden');

        summaryContent.innerHTML = `
          <p class="font-bold text-[#bd1e59] mb-2 text-lg">📌 Kế hoạch hẹn hò nè:</p>
          <p class="mb-1"><b>• Địa điểm:</b> ${locName}</p>
          <p class="mb-1"><b>• Món ăn:</b> ${food}</p>
          <p><b>• Hoạt động:</b> ${activitiesText}</p>
        `;

        confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
      });
    })();
  </script>
</body>
</html>
