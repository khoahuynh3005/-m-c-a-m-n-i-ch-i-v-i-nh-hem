<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute Valentine's Day page to ask someone to be your Valentine!">
  <meta name="theme-color" content="#ffd0e5">
  <title>Valentine's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body class="gradient-background flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl flex flex-col items-center text-center my-auto">
    
    <!-- Hình ảnh đại diện -->
    <img
      id="imageDisplay"
      src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXU1ZnRkbmJ1eXp5bWVmNWt6bWFsbXpjdW82cXBqNmd5Zmc0NSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cf3xm38wmRASY2/giphy.gif"
      alt="Cute kitten with flowers"
      class="rounded-xl h-[250px] object-cover mb-4 shadow-sm"
    />

    <!-- Câu hỏi chính -->
    <h1 id="valentineQuestion" class="text-3xl font-bold italic text-[#bd1e59] my-2">
      Will you be my Valentine?
    </h1>

    <!-- NÚT BẤM YES/NO MÀN HÌNH 1 -->
    <div id="responseButtons" class="flex gap-4 pt-4 items-center justify-center min-h-[60px]">
      <button
        id="yesButton"
        class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-lg text-xl font-medium cursor-pointer px-4 py-2 bg-green-500 text-white transition-all duration-300 ease-in-out hover:bg-green-400 min-h-12 min-w-[75px] shadow-md"
      >
        Yes
      </button>
      <button
        id="noButton"
        class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-xl font-medium cursor-pointer px-4 py-2 bg-red-500 text-white transition-colors hover:bg-red-700 h-12 min-w-[75px] shadow-md"
      >
        No
      </button>
    </div>

    <!-- BẢNG TÙY CHỌN LỊCH HẸN HÒ (Hiện sau khi bấm YES) -->
    <div id="optionsContainer" class="hidden w-full text-left mt-4 space-y-4">
      
      <!-- BƯỚC 1: CHỌN ĐỊA ĐIỂM -->
      <div class="bg-pink-50/80 p-4 rounded-xl border border-pink-200 shadow-sm">
        <label class="block text-lg font-bold text-[#bd1e59] mb-2">Tụi mình sẽ đi đâu nè? 📍</label>
        <div class="flex gap-4 text-gray-700">
          <label class="flex items-center gap-2 cursor-pointer font-medium hover:text-pink-600 transition-colors">
            <input type="radio" name="location" value="HCM" class="accent-pink-500 w-4 h-4" onchange="toggleLocationOptions('HCM')" checked>
            <span>Hồ Chí Minh 🏙️</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer font-medium hover:text-pink-600 transition-colors">
            <input type="radio" name="location" value="VT" class="accent-pink-500 w-4 h-4" onchange="toggleLocationOptions('VT')">
            <span>Vũng Tàu 🌊</span>
          </label>
        </div>
      </div>

      <!-- BẢNG 1: TÙY CHỌN HỒ CHÍ MINH -->
      <div id="hcmOptions" class="space-y-4">
        <!-- Mục 1: Ăn uống HCM -->
        <div class="bg-pink-50/80 p-4 rounded-xl border border-pink-200 shadow-sm">
          <label class="block text-md font-bold text-[#bd1e59] mb-2">1. Ăn món gì ở Sài Gòn đây? 🍲</label>
          <div class="space-y-2 text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="hcmFood" value="Món Hàn Quốc 🇰🇷" class="accent-pink-500 w-4 h-4" checked>
              <span>Món Hàn Quốc 🇰🇷</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="hcmFood" value="Món Nhật Bản 🇯🇵" class="accent-pink-500 w-4 h-4">
              <span>Món Nhật Bản 🇯🇵</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="hcmFood" value="Món Việt Nam 🇻🇳" class="accent-pink-500 w-4 h-4">
              <span>Món Việt Nam 🇻🇳</span>
            </label>
          </div>
        </div>

        <!-- Mục 2: Hoạt động HCM -->
        <div class="bg-pink-50/80 p-4 rounded-xl border border-pink-200 shadow-sm">
          <label class="block text-md font-bold text-[#bd1e59] mb-2">2. Ăn xong mình đi đâu tiếp? 🛵</label>
          <div class="space-y-2 text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="hcmAct" value="Đi mall dạo phố 🛍️" class="accent-pink-500 w-4 h-4 rounded" checked>
              <span>Đi mall dạo phố 🛍️</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="hcmAct" value="Đi quán bí mật 🤫" class="accent-pink-500 w-4 h-4 rounded">
              <span>Đi quán bí mật 🤫</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="hcmAct" value="Thuê homestay chill chill 🏡" class="accent-pink-500 w-4 h-4 rounded">
              <span>Thuê homestay chill chill 🏡</span>
            </label>
          </div>
        </div>
      </div>

      <!-- BẢNG 2: TÙY CHỌN VŨNG TÀU (Ẩn mặc định) -->
      <div id="vtOptions" class="space-y-4 hidden">
        <!-- Mục 1: Ăn uống VT -->
        <div class="bg-pink-50/80 p-4 rounded-xl border border-pink-200 shadow-sm">
          <label class="block text-md font-bold text-[#bd1e59] mb-2">1. Đi biển thì ăn gì nhỉ? 🦀</label>
          <div class="space-y-2 text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="vtFood" value="Hải sản xèo xèo 🦀" class="accent-pink-500 w-4 h-4" checked>
              <span>Hải sản xèo xèo 🦀</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="vtFood" value="Lẩu cá đuối nóng hổi 🍲" class="accent-pink-500 w-4 h-4">
              <span>Lẩu cá đuối nóng hổi 🍲</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="radio" name="vtFood" value="Bánh khọt góc phố 🍳" class="accent-pink-500 w-4 h-4">
              <span>Bánh khọt góc phố 🍳</span>
            </label>
          </div>
        </div>

        <!-- Mục 2: Hoạt động VT -->
        <div class="bg-pink-50/80 p-4 rounded-xl border border-pink-200 shadow-sm">
          <label class="block text-md font-bold text-[#bd1e59] mb-2">2. Chơi gì ở Vũng Tàu ta? 🌅</label>
          <div class="space-y-2 text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="vtAct" value="Ngắm hoàng hôn bờ biển 🌅" class="accent-pink-500 w-4 h-4 rounded" checked>
              <span>Ngắm hoàng hôn bờ biển 🌅</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="vtAct" value="Check-in Hải Đăng/Mũi Nghinh Phong 📸" class="accent-pink-500 w-4 h-4 rounded">
              <span>Check-in Hải Đăng / Mũi Nghinh Phong 📸</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-pink-600">
              <input type="checkbox" name="vtAct" value="Thuê homestay view biển chill 🏡" class="accent-pink-500 w-4 h-4 rounded">
              <span>Thuê homestay view biển chill 🏡</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Nút Chốt đơn -->
      <button
        id="submitOptionsBtn"
        class="w-full py-3 bg-[#bd1e59] text-white font-bold text-lg rounded-xl shadow-lg hover:bg-[#a0184a] transition-all transform hover:scale-[1.02] active:scale-95"
      >
        Chốt đơn luôn! 💕
      </button>
    </div>

    <!-- MÀN HÌNH TỔNG HỢP / CẢM ƠN (Ẩn ban đầu) -->
    <div id="finalSummary" class="hidden text-center mt-2 space-y-3 w-full">
      <div id="summaryContent" class="bg-pink-50 p-4 rounded-xl text-gray-700 leading-relaxed text-left border border-pink-200 shadow-inner">
        <!-- Nội dung sẽ được tổng hợp bằng JavaScript -->
      </div>
      <p class="text-xs text-gray-400 italic">📸 Chụp màn hình này gửi lại cho tui nhen!</p>
    </div>

  </main>

  <script>
    // Hàm chuyển đổi bảng giữa HCM và Vũng Tàu
    function toggleLocationOptions(location) {
      const hcmOptions = document.getElementById('hcmOptions');
      const vtOptions = document.getElementById('vtOptions');
      
      if (location === 'HCM') {
        hcmOptions.classList.remove('hidden');
        vtOptions.classList.add('hidden');
      } else {
        hcmOptions.classList.add('hidden');
        vtOptions.classList.remove('hidden');
      }
    }

    (() => {
      // DOM references
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');
      const optionsContainer = document.getElementById('optionsContainer');
      const submitOptionsBtn = document.getElementById('submitOptionsBtn');
      const finalSummary = document.getElementById('finalSummary');
      const summaryContent = document.getElementById('summaryContent');

      // Các ảnh GIF trực tuyến đảm bảo hiển thị 100%
      const IMAGE_PATHS = [
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXU1ZnRkbmJ1eXp5bWVmNWt6bWFsbXpjdW82cXBqNmd5Zmc0NSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cf3xm38wmRASY2/giphy.gif',
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp2ZXJhOHhpeGsyeXZoc2U0OGNyd3lqenozdXpxa3BtbGttY3ZkayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L952342pdG4mg/giphy.gif',
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndic2pxcGZ1cGZxeTlhOTIxcGFpMnBhYmVudHFpNWJxbzBvdDByZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7SF1r803215ptx254Y/giphy.gif',
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnptZnk4Mzg4OTlhZjM3dGRqZmIyeXBsd2t3ODlhczd2aXU3bzE0NSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OPU6wzx8JrHna/giphy.gif',
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnk1eGVubHdqazAyc2NvZmx2YXNxdzUxdGVrdWFtNW55c3c0dGZneSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22Nyp394QC33076/giphy.gif',
        'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNGQzbHN2YmxsbzB1eWlreGN5c3R4eDVxcGFxcnYxN2Eyb2M1NHBhMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif'
      ];

      const NO_BUTTON_MESSAGES = [
        'No',
        'Are you sure?',
        'Pookie please',
        "Don't do this to me :(",
        "You're breaking my heart",
        "I'm gonna cry...",
      ];

      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 25;
      const MAX_NO_CLICKS = 5;

      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 80;
      let fontSize = 20;

      // Xử lý nút NO
      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;

        noClickCount++;

        imageDisplay.src = IMAGE_PATHS[noClickCount % (IMAGE_PATHS.length - 1)];

        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
      });

      // Xử lý nút YES
      yesButton.addEventListener('click', () => {
        // Đổi sang ảnh mèo ăn mừng
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        
        valentineQuestion.textContent = 'Yayyy!! Chọn lịch đi chơi nè :3';
        responseButtons.style.display = 'none';

        optionsContainer.classList.remove('hidden');

        // Bắn pháo hoa trái tim
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });

        const defaults = { spread: 360, ticks: 100, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };

        confetti({ ...defaults, particleCount: 50, scalar: 2 });
        confetti({ ...defaults, particleCount: 25, scalar: 3 });
        confetti({ ...defaults, particleCount: 10, scalar: 4 });
      });

      // Xử lý bấm nút Chốt đơn
      submitOptionsBtn.addEventListener('click', () => {
        const selectedLoc = document.querySelector('input[name="location"]:checked').value;
        let food = "", acts = [];

        if (selectedLoc === 'HCM') {
          food = document.querySelector('input[name="hcmFood"]:checked')?.value || "Ăn gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="hcmAct"]:checked')).map(cb => cb.value);
        } else {
          food = document.querySelector('input[name="vtFood"]:checked')?.value || "Ăn gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="vtAct"]:checked')).map(cb => cb.value);
        }

        const locName = selectedLoc === 'HCM' ? 'Hồ Chí Minh 🏙️' : 'Vũng Tàu 🌊';
        const activitiesText = acts.length > 0 ? acts.join(', ') : 'về nghỉ ngơi sớm';

        valentineQuestion.textContent = 'Hẹn gặp bồ chuyến đi tới nha! 🥰';
        optionsContainer.classList.add('hidden');
        finalSummary.classList.remove('hidden');

        summaryContent.innerHTML = `
          <p class="font-bold text-[#bd1e59] mb-1">📌 Lịch trình đã chốt:</p>
          <p><b>• Địa điểm:</b> ${locName}</p>
          <p><b>• Món ăn:</b> ${food}</p>
          <p><b>• Hoạt động:</b> ${activitiesText}</p>
        `;

        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      });
    })();
  </script>
</body>
</html>
