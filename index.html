<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute Valentine's Day page to ask someone to be your Valentine!">
  <meta name="theme-color" content="#ffd0e5">
  <title>Valentine's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
  <!-- Preload images so transitions feel instant -->
  <link rel="preload" as="image" href="./images/image1.gif">
  <link rel="preload" as="image" href="./images/image2.gif">
  <link rel="preload" as="image" href="./images/image3.gif">
  <link rel="preload" as="image" href="./images/image4.gif">
  <link rel="preload" as="image" href="./images/image5.gif">
  <link rel="preload" as="image" href="./images/image6.gif">
  <link rel="preload" as="image" href="./images/image7.gif">
</head>
<body class="gradient-background">
  <main class="flex items-center justify-center min-h-screen p-4">
    <section class="flex flex-col items-center p-4 max-w-md w-full">
      <img
        id="imageDisplay"
        src="./images/image1.gif"
        alt="Cute kitten with flowers"
        class="rounded-md h-[300px] object-cover"
      />
      <h1 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4 text-center">
        Will you be my Valentine?
      </h1>

      <!-- MÀN HÌNH 1: NÚT YES / NO GỐC -->
      <div id="responseButtons" class="flex gap-4 pt-5 items-center">
        <button
          id="yesButton"
          class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-md text-xl font-medium cursor-pointer px-4 py-2 bg-green-500 text-white transition-all duration-300 ease-in-out hover:bg-green-400 min-h-12 min-w-[75px]"
        >
          Yes
        </button>
        <button
          id="noButton"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-xl font-medium cursor-pointer px-4 py-2 bg-red-500 text-white transition-colors hover:bg-red-700 h-12 min-w-[75px]"
        >
          No
        </button>
      </div>

      <!-- MÀN HÌNH 2: BẢNG LỰA CHỌN (Bấm YES mới hiện) -->
      <div id="optionsContainer" class="hidden w-full text-left mt-4 space-y-4">
        
        <!-- Chọn Địa điểm -->
        <div>
          <label class="block text-xl font-bold italic text-[#bd1e59] mb-2">Tụi mình sẽ đi đâu nè? 📍</label>
          <div class="flex gap-6 text-gray-800 text-lg">
            <label class="flex items-center gap-2 cursor-pointer font-medium">
              <input type="radio" name="location" value="HCM" class="accent-[#bd1e59] w-5 h-5" onchange="toggleLocationOptions('HCM')" checked>
              <span>Hồ Chí Minh 🏙️</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer font-medium">
              <input type="radio" name="location" value="VT" class="accent-[#bd1e59] w-5 h-5" onchange="toggleLocationOptions('VT')">
              <span>Vũng Tàu 🌊</span>
            </label>
          </div>
        </div>

        <!-- Option Hồ Chí Minh -->
        <div id="hcmOptions" class="space-y-4">
          <div>
            <label class="block text-lg font-bold text-[#bd1e59] mb-1">1. Ăn món gì ở Sài Gòn đây? 🍲</label>
            <div class="space-y-2 text-gray-700 text-base">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="hcmFood" value="Món Hàn Quốc 🇰🇷" class="accent-[#bd1e59] w-4 h-4" checked>
                <span>Món Hàn Quốc 🇰🇷</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="hcmFood" value="Món Nhật Bản 🇯🇵" class="accent-[#bd1e59] w-4 h-4">
                <span>Món Nhật Bản 🇯🇵</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="hcmFood" value="Món Việt Nam 🇻🇳" class="accent-[#bd1e59] w-4 h-4">
                <span>Món Việt Nam 🇻🇳</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-lg font-bold text-[#bd1e59] mb-1">2. Ăn xong mình đi đâu tiếp? 🛵</label>
            <div class="space-y-2 text-gray-700 text-base">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="hcmAct" value="Đi mall dạo phố 🛍️" class="accent-[#bd1e59] w-4 h-4 rounded" checked>
                <span>Đi mall dạo phố 🛍️</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="hcmAct" value="Đi quán bí mật 🤫" class="accent-[#bd1e59] w-4 h-4 rounded">
                <span>Đi quán bí mật 🤫</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="hcmAct" value="Thuê homestay chill chill 🏡" class="accent-[#bd1e59] w-4 h-4 rounded">
                <span>Thuê homestay chill chill 🏡</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Option Vũng Tàu -->
        <div id="vtOptions" class="space-y-4 hidden">
          <div>
            <label class="block text-lg font-bold text-[#bd1e59] mb-1">1. Đi biển thì ăn gì nhỉ? 🦀</label>
            <div class="space-y-2 text-gray-700 text-base">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="vtFood" value="Hải sản xèo xèo 🦀" class="accent-[#bd1e59] w-4 h-4" checked>
                <span>Hải sản xèo xèo 🦀</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="vtFood" value="Lẩu cá đuối nóng hổi 🍲" class="accent-[#bd1e59] w-4 h-4">
                <span>Lẩu cá đuối nóng hổi 🍲</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="vtFood" value="Bánh khọt góc phố 🍳" class="accent-[#bd1e59] w-4 h-4">
                <span>Bánh khọt góc phố 🍳</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-lg font-bold text-[#bd1e59] mb-1">2. Chơi gì ở Vũng Tàu ta? 🌅</label>
            <div class="space-y-2 text-gray-700 text-base">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="vtAct" value="Ngắm hoàng hôn bờ biển 🌅" class="accent-[#bd1e59] w-4 h-4 rounded" checked>
                <span>Ngắm hoàng hôn bờ biển 🌅</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="vtAct" value="Check-in Hải Đăng/Mũi Nghinh Phong 📸" class="accent-[#bd1e59] w-4 h-4 rounded">
                <span>Check-in Hải Đăng / Mũi Nghinh Phong 📸</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="vtAct" value="Thuê homestay view biển chill 🏡" class="accent-[#bd1e59] w-4 h-4 rounded">
                <span>Thuê homestay view biển chill 🏡</span>
              </label>
            </div>
          </div>
        </div>

        <button
          id="submitOptionsBtn"
          class="w-full mt-4 py-3 bg-[#bd1e59] text-white font-bold text-lg rounded-md shadow-md hover:bg-[#a0184a] transition-all cursor-pointer"
        >
          Chốt đơn luôn! 💕
        </button>
      </div>

      <!-- MÀN HÌNH 3: XÁC NHẬN / TỔNG HỢP -->
      <div id="finalSummary" class="hidden text-center mt-4 w-full space-y-2">
        <div id="summaryContent" class="text-left text-gray-800 text-lg leading-relaxed p-4 rounded-md border border-[#bd1e59]/30 bg-white/50">
          <!-- JS sẽ chèn kết quả vào đây -->
        </div>
        <p class="text-sm text-gray-500 italic pt-2">📸 Chụp màn hình này gửi lại cho tui nhen!</p>
      </div>

    </section>
  </main>

  <script>
    function toggleLocationOptions(location) {
      const hcmOptions = document.getElementById('hcmOptions');
      const vtOptions = document.getElementById('vtOptions');
      if (location === 'HCM') {
        hcmOptions.classList.remove('hidden');
        vtOptions.classList.add('hidden');
      } else {
        hcmOptions.classList.add('hidden');
        vtOptions.classList.remove('hidden');
      }
    }

    (() => {
      // DOM references
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');
      const optionsContainer = document.getElementById('optionsContainer');
      const submitOptionsBtn = document.getElementById('submitOptionsBtn');
      const finalSummary = document.getElementById('finalSummary');
      const summaryContent = document.getElementById('summaryContent');

      // Configuration
      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 25;
      const MAX_NO_CLICKS = 5;

      const IMAGE_PATHS = [
        './images/image1.gif',
        './images/image2.gif',
        './images/image3.gif',
        './images/image4.gif',
        './images/image5.gif',
        './images/image6.gif',
        './images/image7.gif',
      ];

      const NO_BUTTON_MESSAGES = [
        'No',
        'Are you sure?',
        'Pookie please',
        "Don't do this to me :(",
        "You're breaking my heart",
        "I'm gonna cry...",
      ];

      const ALT_TEXTS = [
        'Cute kitten with flowers',
        'Sad kitten looking up',
        'Kitten begging',
        'Heartbroken kitten',
        'Crying kitten',
        'Devastated kitten',
        'Happy kitten celebrating',
      ];

      // State
      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 80;
      let fontSize = 20;

      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;

        noClickCount++;

        // Update image and alt text
        imageDisplay.src = IMAGE_PATHS[noClickCount];
        imageDisplay.alt = ALT_TEXTS[noClickCount];

        // Grow the "Yes" button
        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        // Update "No" button text
        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        imageDisplay.alt = ALT_TEXTS[ALT_TEXTS.length - 1];
        valentineQuestion.textContent = 'Yayyy!! Chọn lịch đi chơi nè :3';
        responseButtons.style.display = 'none';

        // Hiện bảng chọn
        optionsContainer.classList.remove('hidden');

        // Heart-shaped confetti
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });

        const defaults = { spread: 360, ticks: 100, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };

        confetti({ ...defaults, particleCount: 50, scalar: 2 });
        confetti({ ...defaults, particleCount: 25, scalar: 3 });
        confetti({ ...defaults, particleCount: 10, scalar: 4 });
      });

      // Xử lý chốt đơn
      submitOptionsBtn.addEventListener('click', () => {
        const selectedLoc = document.querySelector('input[name="location"]:checked').value;
        let food = "", acts = [];

        if (selectedLoc === 'HCM') {
          food = document.querySelector('input[name="hcmFood"]:checked')?.value || "Ăn gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="hcmAct"]:checked')).map(cb => cb.value);
        } else {
          food = document.querySelector('input[name="vtFood"]:checked')?.value || "Ăn gì cũng được";
          acts = Array.from(document.querySelectorAll('input[name="vtAct"]:checked')).map(cb => cb.value);
        }

        const locName = selectedLoc === 'HCM' ? 'Hồ Chí Minh 🏙️' : 'Vũng Tàu 🌊';
        const activitiesText = acts.length > 0 ? acts.join(', ') : 'về nghỉ ngơi sớm';

        valentineQuestion.textContent = 'Hẹn gặp bồ chuyến đi tới nha! 🥰';
        optionsContainer.classList.add('hidden');
        finalSummary.classList.remove('hidden');

        summaryContent.innerHTML = `
          <p class="font-bold text-[#bd1e59] mb-1">📌 Lịch trình đã chốt:</p>
          <p><b>• Địa điểm:</b> ${locName}</p>
          <p><b>• Món ăn:</b> ${food}</p>
          <p><b>• Hoạt động:</b> ${activitiesText}</p>
        `;

        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      });
    })();
  </script>
</body>
</html>
